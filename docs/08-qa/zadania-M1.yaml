    tytul: "QA M1: brak nagłówka Content-Security-Policy z architektury"
    cel: >-
      Architektura (sekcja „Bezpieczeństwo”, nagłówki) wymaga Content-Security-Policy w vercel.json
      (self, bez inline skryptów poza hashami Astro); na stagingu odpowiedź / ma Referrer-Policy,
      X-Content-Type-Options, Permissions-Policy i X-Robots-Tag, ale nie ma CSP (curl -sI
      https://iskt-www.vercel.app/). Dotyczy W-10 (dobre praktyki) i W-12. Poza zakresem: endpoint
      formularza (T6) poza dopuszczeniem connect-src 'self'.
    kryteria:
      - "vercel.json ustawia Content-Security-Policy dla /(.*): default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' (z hashami lub 'unsafe-inline' tylko gdy wymaga tego Astro, uzasadnione w raporcie); script-src 'self' z hashami skryptów Astro; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - "test e2e/qa/M1-scenariusze.spec.ts „QA-M1-2” przechodzi bez test.fixme"
