    cel: >-
      Potencjalny klient wysyła zapytanie z /#kontakt, a e-mail dochodzi do ISKT (W-04, W-05, W-06, W-12;
      ADR-001, ADR-003, ADR-004; architektura: „Model danych”, „Bezpieczeństwo”). Pliki designu:
      D/ISKT-standalone.dc.html l. 154-182 (formularz, stan sukcesu „Dziękujemy!”) i l. 223,
      DS/_ds_bundle.js (Input l. 758 ze stanem błędu, Textarea l. 1099, Button l. 483). Wymaga zadań
      właściciela z planu: konto Resend z kluczem testowym w .env.local i zmiennych Preview Vercel
      (przed startem), reguła rate limit w Vercel Firewall (przed QA M2). Poza zakresem: E2E przekrojowe
      i Lighthouse (T11).
    kryteria:
      - "src/lib/contact-schema.ts (Zod, wspólny dla formularza i endpointu): imię 1-100, e-mail format i ≤ 254, wiadomość 1-5000 znaków (code points), bez CR/LF w imieniu i e-mailu, honeypot website pusty; testy jednostkowe dla wartości poprawnych, pustych, za długich, z CR/LF i maksymalnych długości ze znaków 4-bajtowych"
      - "src/pages/api/contact.ts (prerender=false): tylko POST z application/json i Origin = PUBLIC_SITE_URL; odpowiedzi 200, 400 (fields), 405, 413 (ciało > 32 kB), 415 (inny typ), 429 (rate limit), 502 (błąd lub timeout 10 s Resend); honeypot → 200 bez wysyłki; testy jednostkowe endpointu z mockiem mailera dla każdego kodu, także JSON maksymalnej długości ze znaków 4-bajtowych → 200"
      - "src/lib/mailer.ts: Resend SDK, tekst bez HTML, from CONTACT_FROM, to CONTACT_TO, replyTo nadawcy, AbortController 10 s, MAIL_TRANSPORT=mock w testach; src/lib/rate-limit.ts: providerzy waf (noop), upstash (z mockiem w teście) i pamięciowy tylko do testów; src/lib/log.ts loguje wyłącznie event, status, code, requestId — test sprawdza, że logi z ścieżek sukcesu i błędu nie zawierają imienia, e-maila, treści ani IP"
      - "ContactForm: wysyłka fetch JSON, przycisk zablokowany w trakcie (drugi klik nie wysyła drugiego żądania), sukces „Dziękujemy!”, błędy przy polach z aria-describedby i fokusem na pierwszym błędnym polu, błąd wysyłki i 429 z zachowaniem wpisanych danych, robocza klauzula informacyjna z linkiem /polityka-prywatnosci/; bez JS formularz ukryty, widoczny <noscript> z mailto:biuro@iskt.pl i telefonem (e2e/contact.spec.ts z MAIL_TRANSPORT=mock, także z javaScriptEnabled: false)"
